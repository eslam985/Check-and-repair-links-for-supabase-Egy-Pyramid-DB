name: 🔍 Watcher + 🔧 Repairer System

on:
  schedule:
    # ── Watchers: كل 6 ساعات ──
    - cron: "0 */6 * * *" # VOE Watcher
    - cron: "5 */6 * * *" # Streamtape Watcher
    - cron: "10 */6 * * *" # Lulustream Watcher
    - cron: "15 */6 * * *" # Dood Watcher
    - cron: "20 */6 * * *" # Generic Watcher
    - cron: "25 */6 * * *" # Mixdrop Watcher
    - cron: "30 */6 * * *" # VK Watcher

    # ── Repairers: كل 6 ساعات ──
    - cron: "0 */6 * * *" # VOE Repairer
    - cron: "10 */6 * * *" # Streamtape Repairer
    - cron: "20 */6 * * *" # Dood Repairer
    - cron: "30 */6 * * *" # Lulu Repairer
    - cron: "40 */6 * * *" # Mixdrop Repairer

    # ── Rescue Mission: كل 6 ساعات ──
    - cron: "45 */6 * * *" # Mixdrop Rescue Mission (أضف هذا السطر)
    - cron: "50 */6 * * *" # Streamtape Rescue Mission
    - cron: "55 */6 * * *" # DoodStream Rescue Mission
    - cron: "0 */6 * * *" # LuluStream Rescue Mission
    - cron: "15 */6 * * *" # Sync Videos to Telegram
        # ── Cleaners: مرة في اليوم ──
    - cron: "0 3 * * *" # VK Cleaner

  workflow_dispatch:
    inputs:
      mode:
        description: "اختار السكريبت اللي تشغّله"
        required: true
        default: "watcher_voe"
        type: choice
        options:
          - watcher_voe
          - watcher_streamtape
          - watcher_lulustream
          - watcher_dood
          - watcher_generic
          - watcher_mixdrop # (إضافة هذا السطر)
          - watcher_vk
          
          - repairer_voe
          - repairer_streamtape
          - repairer_dood
          - repairer_lulustream
          - repairer_mixdrop

          - rescue_mixdrop # ← سكريبت إنقاذ ميكس دروب
          - rescue_streamtape
          - rescue_dood
          - rescue_lulu
          - sync_telegram
          
          - cleaner_archive
          - cleaner_vk
      batch_size:
        description: "عدد الروابط (BATCH_SIZE)"
        required: false
        default: "20"

jobs:
  # ─────────────────────────────────────────────
  #                  WATCHERS
  # ─────────────────────────────────────────────
  watcher-voe:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'watcher_voe')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.10" }
      - run: pip install -r requirements.txt
      - name: Run VOE Watcher
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          VOE_API_KEY: ${{ secrets.VOE_API_KEY }}
          BATCH_SIZE: ${{ inputs.batch_size || '100' }}
        run: export PYTHONPATH=$PYTHONPATH:. && python watchers/watcher_voe.py

  watcher-streamtape:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'watcher_streamtape')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
      - run: pip install -r requirements.txt
      - name: Run Streamtape Watcher
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          STREAMTAPE_API_KEY: ${{ secrets.STREAMTAPE_API_KEY }}
          STREAMTAPE_LOGIN: ${{ secrets.STREAMTAPE_LOGIN }}
          MIXDROP_EMAIL: ${{ secrets.MIXDROP_EMAIL }}
          BATCH_SIZE: ${{ inputs.batch_size || '100' }}
        run: export PYTHONPATH=$PYTHONPATH:. && python watchers/watcher_streamtape.py

  watcher-lulustream:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'watcher_lulustream')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.10" }
      - run: pip install -r requirements.txt
      - name: Run Lulustream Watcher
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          LULUSTREAM_API_KEY: ${{ secrets.LULUSTREAM_API_KEY }}
          BATCH_SIZE: ${{ inputs.batch_size || '100' }}
        run: export PYTHONPATH=$PYTHONPATH:. && python watchers/watcher_lulustream.py

  watcher-dood:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'watcher_dood')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.10" }
      - run: pip install -r requirements.txt
      - name: Run Dood Watcher
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          DOOD_API_KEY: ${{ secrets.DOOD_API_KEY }}
          BATCH_SIZE: ${{ inputs.batch_size || '100' }}
        run: export PYTHONPATH=$PYTHONPATH:. && python watchers/watcher_dood.py

  watcher-generic:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'watcher_generic')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.10" }
      - run: pip install -r requirements.txt
      - name: Run Generic Watcher (Archive/Telegram)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          BATCH_SIZE: ${{ inputs.batch_size || '1' }}
        run: export PYTHONPATH=$PYTHONPATH:. && python watchers/watcher_generic.py

  watcher-mixdrop:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'watcher_mixdrop')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.10" }
      - run: pip install -r requirements.txt
      - name: Run Mixdrop Watcher
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          MIXDROP_EMAIL: ${{ secrets.MIXDROP_EMAIL }}
          MIXDROP_KEY: ${{ secrets.MIXDROP_KEY }}
          BATCH_SIZE: ${{ inputs.batch_size || '100' }} # افتراضي 20 لحماية الأداء
        run: export PYTHONPATH=$PYTHONPATH:. && python watchers/watcher_mixdrop.py

  watcher-vk:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'watcher_vk')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.10" }
      - run: pip install -r requirements.txt
      - name: Run VK Watcher
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          VK_SERVICE_KEY: ${{ secrets.VK_SERVICE_KEY }}
          BATCH_SIZE: ${{ inputs.batch_size || '100' }}
        run: export PYTHONPATH=$PYTHONPATH:. && python watchers/watcher_vk.py

  # ─────────────────────────────────────────────
  #                  REPAIRERS
  # ─────────────────────────────────────────────
  repairer-voe:
    if: >
      (github.event_name == 'schedule' && github.event.schedule == '0 */6 * * *') ||
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'repairer_voe')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.10" }
      - run: pip install -r requirements.txt
      - name: Install Playwright Chromium
        run: playwright install chromium --with-deps
      - name: Run VOE Repairer
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          VOE_API_KEY: ${{ secrets.VOE_API_KEY }}
          BATCH_SIZE: ${{ inputs.batch_size || '100' }}
        run: export PYTHONPATH=$PYTHONPATH:. && python repairers/repairer_voe.py

  repairer-streamtape:
    if: >
      (github.event_name == 'schedule' && github.event.schedule == '10 */6 * * *') ||
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'repairer_streamtape')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.10" }
      - run: pip install -r requirements.txt
      - name: Run Streamtape Repairer
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          STREAMTAPE_API_KEY: ${{ secrets.STREAMTAPE_API_KEY }}
          STREAMTAPE_LOGIN: ${{ secrets.STREAMTAPE_LOGIN }}
          MIXDROP_EMAIL: ${{ secrets.MIXDROP_EMAIL }}
          BATCH_SIZE: ${{ inputs.batch_size || '100' }}
        run: export PYTHONPATH=$PYTHONPATH:. && python repairers/repairer_streamtape.py

  repairer-dood:
    if: >
      (github.event_name == 'schedule' && github.event.schedule == '20 */6 * * *') ||
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'repairer_dood')

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.10" }
      - run: pip install -r requirements.txt
      - name: Install Playwright Chromium
        run: playwright install chromium --with-deps
      - name: Run Dood Repairer
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          DOOD_API_KEY: ${{ secrets.DOOD_API_KEY }}
          BATCH_SIZE: ${{ inputs.batch_size || '100' }}
        run: export PYTHONPATH=$PYTHONPATH:. && python repairers/repairer_dood.py

  repairer-lulustream:
    if: >
      (github.event_name == 'schedule' && github.event.schedule == '30 */6 * * *') ||
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'repairer_lulustream')

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.10" }
      - run: pip install -r requirements.txt
      - name: Install Playwright Chromium
        run: playwright install chromium --with-deps

      - name: Run Lulustream Repairer
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          LULUSTREAM_API_KEY: ${{ secrets.LULUSTREAM_API_KEY }}
          BATCH_SIZE: ${{ inputs.batch_size || '100' }}
        run: export PYTHONPATH=$PYTHONPATH:. && python repairers/repairer_lulustream.py

  repairer-mixdrop:
    if: >
      (github.event_name == 'schedule' && github.event.schedule == '40 */6 * * *') ||
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'repairer_mixdrop')

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.10" }
      - run: pip install -r requirements.txt
      - name: Install Playwright Chromium
        run: playwright install chromium --with-deps

      - name: Run Mixdrop Repairer
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          MIXDROP_EMAIL: ${{ secrets.MIXDROP_EMAIL }}
          MIXDROP_KEY: ${{ secrets.MIXDROP_KEY }}
          BATCH_SIZE: ${{ inputs.batch_size || '100' }} # افتراضي 5 لحماية زمن المعالجة الطويل للـ Remote Upload
        run: export PYTHONPATH=$PYTHONPATH:. && python repairers/repairer_mixdrop.py

  cleaner-archive:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'cleaner_archive'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.10" }
      - run: pip install -r requirements.txt
      - name: Run Archive Cleaner
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          CLEANER_BATCH_SIZE: ${{ inputs.batch_size || '5' }} # افتراضي 100 رابط للفحص السريع
        run: export PYTHONPATH=$PYTHONPATH:. && python repairers/cleaner_archive.py

  cleaner-vk:
    if: >
      (github.event_name == 'schedule' && github.event.schedule == '0 3 * * *') ||
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'cleaner_vk')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.10" }
      - run: pip install -r requirements.txt
      - name: Run VK Cleaner
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          VK_SERVICE_KEY: ${{ secrets.VK_SERVICE_KEY }}
          CLEANER_BATCH_SIZE: ${{ inputs.batch_size || '100' }}
        run: export PYTHONPATH=$PYTHONPATH:. && python repairers/cleaner_vk.py

  # ─────────────────────────────────────────────
  #                  mission_to_rescue
  # ─────────────────────────────────────────────
  rescue-mixdrop:
    if: >
      (github.event_name == 'schedule' && github.event.schedule == '45 */6 * * *') ||
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'rescue_mixdrop')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.10" }
      - run: pip install -r requirements.txt
      - name: Install Playwright Chromium
        run: playwright install chromium --with-deps
      - name: Run Mixdrop Rescue Mission
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          MIXDROP_EMAIL: ${{ secrets.MIXDROP_EMAIL }}
          MIXDROP_KEY: ${{ secrets.MIXDROP_KEY }}
          BATCH_SIZE: ${{ inputs.batch_size || '10' }}
        run: export PYTHONPATH=$PYTHONPATH:. && python backup/mixdrop/mission_to_rescue_mixdrop.py

  rescue-streamtape:
      if: >
        (github.event_name == 'schedule' && github.event.schedule == '50 */6 * * *') ||
        (github.event_name == 'workflow_dispatch' && inputs.mode == 'rescue_streamtape')
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4
        - uses: actions/setup-python@v5
          with: { python-version: "3.10" }
        - run: pip install -r requirements.txt
        - name: Run Streamtape Rescue Mission
          env:
            SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
            SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
            STREAMTAPE_LOGIN: ${{ secrets.STREAMTAPE_LOGIN }}
            STREAMTAPE_KEY: ${{ secrets.STREAMTAPE_KEY }}
            BATCH_SIZE: ${{ inputs.batch_size || '10' }}
          run: export PYTHONPATH=$PYTHONPATH:. && python backup/streamtape/streamtape_rescue.py

  rescue-dood:
    if: >
      (github.event_name == 'schedule' && github.event.schedule == '55 */6 * * *') ||
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'rescue_dood')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.10" }
      - run: pip install -r requirements.txt
      - name: Run DoodStream Rescue Mission
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          DOOD_API_KEY: ${{ secrets.DOOD_API_KEY }}
          BATCH_SIZE: ${{ inputs.batch_size || '10' }}
        run: export PYTHONPATH=$PYTHONPATH:. && python backup/dood/doodstream_rescue.py


  rescue-lulu:
    if: >
      (github.event_name == 'schedule' && github.event.schedule == '0 */6 * * *') ||
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'rescue_lulu')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.10" }
      - run: pip install -r requirements.txt
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium
      - name: Run LuluStream Rescue Mission
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          LULUSTREAM_API_KEY: ${{ secrets.LULUSTREAM_API_KEY }}
          BATCH_SIZE: ${{ inputs.batch_size || '10' }}
        run: export PYTHONPATH=$PYTHONPATH:. && python backup/lulustream/lulu_rescue.py

  sync-telegram:
    if: >
      (github.event_name == 'schedule' && github.event.schedule == '15 */6 * * *') ||
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'sync_telegram')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.10" }
      - name: Install Dependencies
        run: pip install -r egy_sync_to_telegram/requirements.txt
      - name: Install Playwright Browsers & System Dependencies
        run: npx playwright install --with-deps chromium
      - name: Run Telegram Sync Engine
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION_STRING: ${{ secrets.TELEGRAM_SESSION_STRING }}
          POLL_INTERVAL_SECONDS: ${{ secrets.POLL_INTERVAL_SECONDS || '10' }}
        run: |
          export PYTHONPATH=$PYTHONPATH:.
          python egy_sync_to_telegram/app.py